name: CI/CD Pipeline - flatshare-backend

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      run-deploy:
        description: 'Should perform deployment after successful build and tests?'
        required: true
        default: false
        type: boolean

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'maven'

      - name: Start PostgreSQL Database and Azurite
        run: docker compose up -d postgres azurite pgweb

      - name: Wait for database to initialize
        run: sleep 10

      - name: Build and Test with Maven
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Upload Test Reports (Surefire)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Test Reports (Failsafe)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-failsafe-reports
          path: target/failsafe-reports/
          retention-days: 7

      - name: Publish Test Results to GitHub UI
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml

      - name: Upload JAR artifact for deployment
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: java-app
          path: target/*.jar

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    if: (github.event_name == 'push' && 
     (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/KAN-16-CD' || github.ref == 'refs/heads/develop')) 
      || 
     (github.event_name == 'workflow_dispatch' && inputs.run-deploy == true)
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0DAB568B255B4F26A42AC3CF79CB3E9F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5FB56BF555114B69B04B3DC9508DF321 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E2AC8E368F884047834E3AF43446EBC9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'flatshare-backend'
          slot-name: 'Production'
          package: '*.jar'
